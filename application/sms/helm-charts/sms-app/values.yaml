# SMS Application - Umbrella Chart Values
# These values override the individual chart defaults

# Global values shared across all subcharts
global:
  environment: production
  region: ap-southeast-1
  domain: sms.duleendra.com

# Frontend subchart overrides
frontend:
  replicaCount: 3 # Override default of 2

  image:
    tag: "1.23" # Override default nginx version

  ingress:
    enabled: true
    ingressClassName: alb # Modern approach - replaces kubernetes.io/ingress.class annotation
    annotations:
      # Production ALB settings (override defaults)
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'

      # Production health checks (more aggressive)
      alb.ingress.kubernetes.io/healthcheck-path: /
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
      alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "3"
      alb.ingress.kubernetes.io/healthy-threshold-count: "2"
      alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

      # Production SSL/TLS
      alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-southeast-1:793209430381:certificate/b696306d-dc58-4830-b9df-da54153b31c4"
      alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS-1-2-2017-01"
      alb.ingress.kubernetes.io/ssl-redirect: "443"

      # Production subnets and security
      alb.ingress.kubernetes.io/subnets: "subnet-012260aacd52b825a,subnet-07616087a28b9fcc4"
      alb.ingress.kubernetes.io/security-groups: "sg-00bb983fb11ec3c00"

      # Production tags
      alb.ingress.kubernetes.io/tags: "Environment=production,Project=sms-app,Team=platform"

      # Production load balancer attributes
      alb.ingress.kubernetes.io/load-balancer-attributes: "idle_timeout.timeout_seconds=300,routing.http2.enabled=true"

    hosts:
      - host: sms.duleendra.com # Production domain
        paths:
          - path: /
            pathType: Prefix

    tls: []
  #      - secretName: sms-app-tls
  #        hosts:
  #          - sms.duleendra.com

  resources:
    # Production resource limits (higher than defaults)
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

# MongoDB subchart overrides
mongodb:
  replicaCount: 3 # Production replica set
  host: "sms-mongodb"
  port: 27017
  serviceAccount:
    name: "secrets-store-csi-driver"
    annotations:
      # Production IAM role
      eks.amazonaws.com/role-arn: "arn:aws:iam::793209430381:role/secrets-store-csi-driver-role"

  secretsManager:
    secretName: "my-app-secret2" # Production secret

  service:
    type: ClusterIP
    clusterIP: None # Headless service for StatefulSet
    port: 27017
    annotations: {}

  persistence:
    size: 100Gi # Larger storage for production
    storageClass: "gp2"

  resources:
    # Production MongoDB resources
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
