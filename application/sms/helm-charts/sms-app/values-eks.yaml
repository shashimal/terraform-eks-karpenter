# EKS Production Environment Configuration
# Use with: helm install sms-app ./sms-app -f values-eks.yaml
# Prerequisites:
#   - AWS Load Balancer Controller installed in EKS cluster
#   - Route53 hosted zone configured
#   - ACM certificate created

global:
  environment: production
  domain: sms.yourdomain.com

# Main ingress configuration for EKS with ALB
ingress:
  enabled: true
  className: "alb"
  annotations:
    # AWS Load Balancer Controller annotations
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: sms-app-alb

    # SSL/TLS Configuration
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:123456789012:certificate/your-cert-arn
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'

    # Health checks
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    # Security
    alb.ingress.kubernetes.io/security-groups: sg-xxxxxxxxx
    alb.ingress.kubernetes.io/subnets: subnet-xxxxxxxx,subnet-yyyyyyyy

    # Performance
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      idle_timeout.timeout_seconds=60,
      routing.http2.enabled=true,
      access_logs.s3.enabled=true,
      access_logs.s3.bucket=your-alb-logs-bucket,
      access_logs.s3.prefix=sms-app

    # WAF (optional)
    # alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-west-2:123456789012:regional/webacl/your-waf-acl/xxxxx

  hosts:
    - host: sms.yourdomain.com
      paths:
        # API paths with higher priority (more specific paths first)
        - path: /api/auth
          pathType: Prefix
          serviceName: sms-auth-service
          servicePort: 80
        - path: /api/users
          pathType: Prefix
          serviceName: sms-auth-service
          servicePort: 80
        - path: /api/courses
          pathType: Prefix
          serviceName: sms-course-service
          servicePort: 80
        - path: /api/students
          pathType: Prefix
          serviceName: sms-student-service
          servicePort: 80
        # Frontend catch-all (must be last)
        - path: /
          pathType: Prefix
          serviceName: sms-frontend
          servicePort: 80

  tls:
    - secretName: sms-app-tls
      hosts:
        - sms.yourdomain.com

##############################################################################
# Frontend Service Configuration for EKS Production
##############################################################################
frontend:
  replicaCount: 3 # Multiple replicas for HA

  image:
    repository: your-ecr-repo/sms-frontend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: false # Using main ingress

  env:
    REACT_APP_STUDENT_API_URL: "/api/students"
    REACT_APP_COURSE_API_URL: "/api/courses"
    REACT_APP_AUTH_API_URL: "/api/auth"
    REACT_APP_USER_API_URL: "/api/users"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

##############################################################################
# MongoDB Configuration for EKS Production
##############################################################################
mongodb:
  # Use external MongoDB service (DocumentDB, Atlas, etc.)
  enabled: false

  # External MongoDB connection
  external:
    enabled: true
    connectionString: "mongodb://username:password@your-documentdb-cluster.cluster-xxxxx.us-west-2.docdb.amazonaws.com:27017/smsapp?ssl=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"

##############################################################################
# Auth Service Configuration for EKS Production
##############################################################################
auth-service:
  replicaCount: 2

  image:
    repository: your-ecr-repo/sms-auth-service
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  env:
    - name: PORT
      value: "8080"
    - name: NODE_ENV
      value: "production"
    - name: MONGODB_URI
      valueFrom:
        secretKeyRef:
          name: mongodb-secret
          key: connection-string
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: jwt-secret
          key: secret-key

##############################################################################
# Course Service Configuration for EKS Production
##############################################################################
course-service:
  replicaCount: 2

  image:
    repository: your-ecr-repo/sms-course-service
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  env:
    PORT: "8081"
    NODE_ENV: "production"
    MONGODB_URI:
      valueFrom:
        secretKeyRef:
          name: mongodb-secret
          key: connection-string

##############################################################################
# Student Service Configuration for EKS Production
##############################################################################
student-service:
  replicaCount: 2

  image:
    repository: your-ecr-repo/sms-student-service
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  env:
    PORT: "8082"
    NODE_ENV: "production"
    MONGODB_URI:
      valueFrom:
        secretKeyRef:
          name: mongodb-secret
          key: connection-string

  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: "gp3" # EKS optimized storage class
    mountPath: "/app/uploads"
