{{- if and (eq .Values.global.environment "production") .Values.secretsManager.enabled }}
# Centralized AWS Secrets Manager SecretProviderClass for Production
# This replaces individual SecretProviderClass resources in subcharts
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "sms-app.fullname" . }}-secrets
  labels:
    {{- include "sms-app.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      # MongoDB credentials
      - objectName: "{{ .Values.secretsManager.appSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "MONGODB_USERNAME"
            objectAlias: "MONGODB_USERNAME"
          - path: "MONGODB_PASSWORD"
            objectAlias: "MONGODB_PASSWORD"
          - path: "MONGODB_URI"
            objectAlias: "MONGODB_URI"
          - path: "JWT_SECRET"
            objectAlias: "JWT_SECRET"
  secretObjects:
    # Main application secrets
    - secretName: {{ include "sms-app.fullname" . }}-secret
      type: Opaque
      data:
        - objectName: "MONGODB_URI"
          key: "MONGODB_URI"
        - objectName: "MONGODB_USERNAME"
          key: "MONGODB_USERNAME"
        - objectName: "MONGODB_PASSWORD"
          key: "MONGODB_PASSWORD"
        - objectName: "JWT_SECRET"
          key: "JWT_SECRET"
{{- end }}