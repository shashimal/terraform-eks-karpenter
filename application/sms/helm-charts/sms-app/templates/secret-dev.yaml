{{- if ne .Values.global.environment "production" }}
# Regular Kubernetes Secret for Development Environment
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sms-app.fullname" . }}-secret
  labels:
    {{- include "sms-app.labels" . | nindent 4 }}
type: Opaque
data:
  # MongoDB connection string (base64 encoded)
  MONGODB_URI: {{ printf "mongodb://%s:%s@%s:%s/%s?authSource=admin" 
    .Values.mongodb.auth.username 
    .Values.mongodb.auth.password 
    (.Values.mongodb.host | default "sms-mongodb")
    (.Values.mongodb.port | default "27017" | toString)
    (.Values.mongodb.auth.database | default "smsapp") | b64enc }}
  
  # MongoDB auth credentials (for MongoDB service)
  username: {{ .Values.mongodb.auth.username | b64enc }}
  password: {{ .Values.mongodb.auth.password | b64enc }}
  
  # JWT Secret for auth service
  JWT_SECRET: {{ index .Values "auth-service" "jwtSecret" | default "dev-jwt-secret-key-not-for-production" | b64enc }}
{{- end }}