{{- if and (eq .Values.global.environment "production") .Values.secretsManager.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sms-app.fullname" . }}-secrets-sa
  labels:
    {{- include "sms-app.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.secretsManager.serviceAccount.roleArn }}
automountServiceAccountToken: true
{{- end }}