apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sms-app.fullname" . }}-config
  labels:
    {{- include "sms-app.labels" . | nindent 4 }}
data:
  # Common environment variables
  NODE_ENV: {{ .Values.global.environment | default "development" | quote }}
  
  # Database configuration
  MONGODB_HOST: {{ .Values.mongodb.host | default "sms-mongodb" | quote }}
  MONGODB_PORT: {{ .Values.mongodb.port | default "27017" | quote }}
  MONGODB_DATABASE: {{ .Values.mongodb.auth.database | default "smsapp" | quote }}
  
  # Service-specific ports
  AUTH_SERVICE_PORT: {{ index .Values "auth-service" "env" "PORT" | default "8080" | quote }}
  COURSE_SERVICE_PORT: {{ index .Values "course-service" "env" "PORT" | default "8081" | quote }}
  STUDENT_SERVICE_PORT: {{ index .Values "student-service" "env" "PORT" | default "8082" | quote }}
  
  # Frontend API URLs
  REACT_APP_STUDENT_API_URL: {{ .Values.frontend.env.REACT_APP_STUDENT_API_URL | default "/api/students" | quote }}
  REACT_APP_COURSE_API_URL: {{ .Values.frontend.env.REACT_APP_COURSE_API_URL | default "/api/courses" | quote }}
  REACT_APP_AUTH_API_URL: {{ .Values.frontend.env.REACT_APP_AUTH_API_URL | default "/api/auth" | quote }}
  REACT_APP_USER_API_URL: {{ .Values.frontend.env.REACT_APP_USER_API_URL | default "/api/users" | quote }}