{{- if .Values.secretsManager.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "mongodb.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.secretsManager.secretName }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "username"
          - path: "password"
            objectAlias: "password"
          {{- if .Values.secretsManager.additionalFields }}
          {{- range .Values.secretsManager.additionalFields }}
          - path: "{{ .path }}"
            objectAlias: "{{ .alias }}"
          {{- end }}
          {{- end }}
  secretObjects:
    - secretName: {{ include "mongodb.fullname" . }}-credentials
      type: Opaque
      data:
        - objectName: username
          key: username
        - objectName: password
          key: password
        {{- if .Values.secretsManager.additionalFields }}
        {{- range .Values.secretsManager.additionalFields }}
        - objectName: {{ .alias }}
          key: {{ .alias }}
        {{- end }}
        {{- end }}
{{- end }}