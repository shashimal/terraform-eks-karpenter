# Source: sms-app/charts/mongodb/templates/secretprovider.yaml
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sms-mongodb-secrets
  namespace: default
  labels:
    helm.sh/chart: mongodb-0.1.0
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: sms
    app.kubernetes.io/version: "6.0"
    app.kubernetes.io/managed-by: Helm
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "my-app-secret2"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "username"
          - path: "password"
            objectAlias: "password"
  secretObjects:
    - secretName: sms-mongodb-credentials
      type: Opaque
      data:
        - objectName: username
          key: username
        - objectName: password
          key: password
