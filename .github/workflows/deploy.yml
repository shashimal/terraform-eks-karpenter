name: Deploy EKS Application to Dev Environment

on:
  push:
    branches:
      - eks-student-app

jobs:
  build-and-push:
    environment: dev
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          role-session-name: gh-actions
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          registries: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Setup image repo and tag
        run: |
          {
            echo "AWS_REGION=${{ secrets.AWS_REGION }}"
            echo "REPOSITORY=student-service"
            echo "IMAGE_REPOSITORY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/student-service"
            echo "IMAGE_TAG=${GITHUB_SHA::8}"
          } >> "${GITHUB_ENV}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        shell: bash

      - name: Print GITHUB_ENV file
        run: cat $GITHUB_ENV

      - name: Set up Docker Context for Buildx
        id: buildx-context
        run: |
          docker context create builders

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest
          endpoint: builders
      # Step 4: Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./application/student-service  # Path to the folder where your Dockerfile is
          file: ./application/student-service/Dockerfile  # Path to your Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
